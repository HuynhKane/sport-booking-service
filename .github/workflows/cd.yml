name: Backend CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-production
  cancel-in-progress: true

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make scripts executable
        run: chmod +x gradlew scripts/smoke-test.sh

      - name: Run clean build
        run: ./gradlew clean build --no-daemon

  deploy:
    name: Deploy to Render
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check deployment configuration
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          SERVICE_URL: ${{ vars.BACKEND_BASE_URL }}
        run: |
          test -n "$DEPLOY_HOOK"
          test -n "$SERVICE_URL"

      - name: Trigger exact commit deployment
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          separator='?'
          if [[ "$DEPLOY_HOOK" == *'?'* ]]; then
            separator='&'
          fi
          curl --fail --silent --show-error --request POST \
            "${DEPLOY_HOOK}${separator}ref=${COMMIT_SHA}"

      - name: Check out smoke-test script
        uses: actions/checkout@v6

      - name: Verify deployed commit
        env:
          SERVICE_URL: ${{ vars.BACKEND_BASE_URL }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: bash scripts/smoke-test.sh "$SERVICE_URL" "$EXPECTED_COMMIT"
