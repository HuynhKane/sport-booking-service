spring.application.name=sport-booking-service
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/sport_booking}
spring.datasource.username=${DATABASE_USERNAME:sport_booking}
spring.datasource.password=${DATABASE_PASSWORD:sport_booking}
spring.datasource.hikari.data-source-properties.sslmode=${DATABASE_SSL_MODE:disable}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.url=/openapi.yaml

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.info.env.enabled=true
management.info.git.enabled=false
management.info.java.enabled=false
management.info.os.enabled=false
management.info.process.enabled=false
info.app.name=${spring.application.name}
info.app.commit=${RENDER_GIT_COMMIT:local}
