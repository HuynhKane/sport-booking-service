services:
  database:
    image: postgis/postgis:17-3.5
    platform: linux/amd64
    environment:
      POSTGRES_DB: sport_booking
      POSTGRES_USER: sport_booking
      POSTGRES_PASSWORD: sport_booking
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sport_booking -d sport_booking"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
